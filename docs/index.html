  <div id="app"></div>

  <!-- The $docsify config object MUST be defined before any plugin script is  -->
  <!-- loaded. Plugins register themselves by pushing onto window.$docsify.    -->
  <!-- plugins as they load, so a plain 'window.$docsify = {...}' assignment   -->
  <!-- after them would discard every plugin that had already registered.      -->
  <script>
    window.$docsify = {
      name: 'iCloud3 iDevice Tracker',
      logo: 'ic3_cloud_logo.png',
      coverpage: false,
      loadSidebar: true,
      autoHeader: false,
      loadNavbar: false,
      auto2top: true,
      relativePath: false,
      maxDepth: 3,
      subMaxLevel: 2,
      search: {
        paths: 'auto',
        placeholder: 'Search iCloud3 documentation',
        noData: 'No results found',
        depth: 6,
        maxAge: 3600000,
        namespace: 'icloud3-v5-clean',
        resultSource: 'breadcrumb'
      },
      plugins: []
    };
  </script>

  <script src="./search-enhancements.js?v=2"></script>
